<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recently Viewed Products</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Product Store</h1>

    <!-- Products -->
    <div class="products">

        <div class="product">
            <h2>Laptop</h2>
            <p>₹50,000</p>
            <button onclick="viewProduct('Laptop', 50000)">
                View Product
            </button>
        </div>

        <div class="product">
            <h2>Mouse</h2>
            <p>₹800</p>
            <button onclick="viewProduct('Mouse', 800)">
                View Product
            </button>
        </div>

        <div class="product">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
            <button onclick="viewProduct('Keyboard', 1500)">
                View Product
            </button>
        </div>

        <div class="product">
            <h2>Monitor</h2>
            <p>₹12,000</p>
            <button onclick="viewProduct('Monitor', 12000)">
                View Product
            </button>
        </div>

        <div class="product">
            <h2>Headphones</h2>
            <p>₹2,000</p>
            <button onclick="viewProduct('Headphones', 2000)">
                View Product
            </button>
        </div>

        <div class="product">
            <h2>Mobile</h2>
            <p>₹25,000</p>
            <button onclick="viewProduct('Mobile', 25000)">
                View Product
            </button>
        </div>

    </div>


    <!-- Product Detail Modal -->

    <div id="modal" class="modal">

        <div class="modal-content">

            <span onclick="closeModal()" class="close">
                &times;
            </span>

            <h2 id="productName"></h2>

            <p id="productPrice"></p>

            <button onclick="closeModal()">
                Close
            </button>

        </div>

    </div>


    <!-- Recently Viewed -->

    <section class="recent-section">

        <div class="recent-header">

            <h2>Recently Viewed</h2>

            <button onclick="clearHistory()">
                Remove History
            </button>

        </div>

        <div id="recentlyViewed" class="recent-products">

            <!-- JavaScript will add products here -->

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
